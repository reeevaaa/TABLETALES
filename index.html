<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Natasha Gandhi - Chef Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="artist-profile">
        <div class="hero">
            
            <img src="hero.jpeg" alt="Natasha Gandhi" class="hero-image">
            <div class="overlay">
                <h1 class="artist-name">Natasha Gandhi</h1>
                <p class="artist-bio">Culinary Innovator</p>
            </div>
        </div>
        <div class="highlights">
            <div class="primary-highlights">
                <span class="icon"><i class="fas fa-award"></i> MasterChef Finalist</span>
                <span class="icon"><i class="fas fa-utensils"></i> Biryani Expert</span>
            </div>
            <div class="awards-ratings">
                <div class="stars">⭐⭐⭐⭐⭐</div>
                <div class="rating">4.9/5</div>
            </div>
            <div class="secondary-highlights">
                <p> MasterChef India Finalist | Founder of House of Millets | 1.5M+ followers on Instagram</p>
            </div>
        </div>
        <div class="events">
            <h2>Featured Event</h2>
            <a href="events.html" class="event-link">
                <div class="event">
                    <img src="WhatsApp Image 2025-02-11 at 7.40.05 PM (1).jpeg" alt="Event Image" class="event-img">
                    <h3>Biryanis & Beers</h3>
                    <p>
                         A culinary journey where tradition meets craft
                        
                    </p>
                </div>
            </a>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
