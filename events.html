<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biryanis & Beers - Event Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="event-details">
        <a href="index.html" class="back-button">← Back</a>
        <h2>Biryanis & Beers</h2>
        
        <div class="event-info">
            <div class="info-item">
                <i class="date-icon">📅</i>
                <div class="info-text">
                    <h4>Date</h4>
                    <span>February 15, 2024</span>
                </div>
            </div>
            <div class="info-item">
                <i class="time-icon">⏰</i>
                <div class="info-text">
                    <h4>Time</h4>
                    <span>7:00 PM - 10:00 PM</span>
                </div>
            </div>
            <div class="info-item">
                <i class="venue-icon">📍</i>
                <div class="info-text">
                    <h4>Venue</h4>
                    <span>The Melting Pot, Mumbai</span>
                </div>
            </div>
        </div>

        <div class="gallery-container">
            <button class="gallery-nav prev">←</button>
            <div class="gallery-view">
                <img src="WhatsApp Image 2025-02-11 at 7.40.05 PM (1).jpeg" alt="Event Image 1" class="gallery-img active">
                <img src="WhatsApp Image 2025-02-11 at 7.40.21 PM (1).jpeg" alt="Event Image 2" class="gallery-img">
                <img src="WhatsApp Image 2025-02-11 at 7.40.28 PM (1).jpeg" alt="Event Image 3" class="gallery-img">
                <img src="WhatsApp Image 2025-02-11 at 7.41.08 PM (1).jpeg" alt="Event Image 4" class="gallery-img">
            </div>
            <button class="gallery-nav next">→</button>
            <div class="gallery-dots"></div>
        </div>

        <p class="event-description">Join us for an extraordinary culinary experience where traditional biryani meets craft beer. Experience the perfect blend of flavors and aromas in this unique gastronomic journey.</p>
    </div>
    <script src="app.js"></script>
</body>
</html>
